<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./styles.css">
    </head>
    <body>
        <!-- Hero Section -->
        <div class="hero">
            <div class="site-width">
                <div class="header">
                    <div class="header-logo">
                        Header Logo
                    </div>
                    <div class="header-links">
                        <ul>
                            <li>header link one</li>
                            <li>header link two</li>
                            <li>header link three</li>
                        </ul>
                    </div>
                </div>
                <div class="hero-content">
                    <div class="hero-left">
                        <h1 class="hero-main-text">This website is awesome</h1>
                        <p class="hero-secondary-text">This website has some subtext that goes here under the main title. It's a smaller font and the color si lower contrast.</p>
                        <button class="hero-button">Sign up</button>
                    </div>
                    <div class="hero-right">

                    </div>
                </div>
            </div>
        </div>

        <!-- Information Section -->
        <div class="information">
            <div class="site-width">
                <h1 class="information-main-title">Some random information.</h1>
                <div class="card-entries">
                    <div class="card">
                        <div class="card-image">

                        </div>
                        <p class="card-text">this is some subtext under an illustration or image</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Quote Section -->
        <div class="quote">
            <div class="site-width">

            </div>
        </div>

        <!-- Call to Action Section -->
        <div class="cta">
            <div class="site-width">

            </div>
        </div>

        <!-- Footer Section -->
        <div class="footer">
            <div class="site-width">

            </div>
        </div> 
    </body>
</html>
